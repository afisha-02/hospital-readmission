version: '3.8'

services:
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

  streamlit:
    build: .
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
